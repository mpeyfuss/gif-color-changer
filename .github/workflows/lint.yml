name: Lint

on:
  push:
  pull_request:

jobs:
  lint:
    name: Lint and type check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Run pre-commit hooks
        run: uv run --python 3.11 pre-commit run --all-files --show-diff-on-failure
