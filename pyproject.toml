[project]
name = "gif-color-changer"
version = "0.5.1"
description = "Replace colors across every frame of a GIF from the command line."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.4.4",
    "pillow>=12.2.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pyrefly>=1.3.1",
    "pytest>=9.0.3",
    "ruff>=0.16.9",
]

[project.urls]
Repository = "https://github.com/mpeyfuss/gif-color-changer"
Issues = "https://github.com/mpeyfuss/gif-color-changer/issues"

[project.scripts]
gifcc = "gif_color_changer.cli:main"

[build-system]
requires = ["uv_build>=0.11.6,<0.12"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # import sorting
    "B",   # bugbear (likely bugs)
    "UP",  # pyupgrade (modern syntax for 3.11+)
    "SIM", # simplifications
    "C4",  # comprehension cleanups
]
# The formatter owns line length; long help strings and docstrings are fine.
ignore = ["E501"]

[tool.pyrefly]
project-includes = ["src", "tests"]
python-version = "3.11"

# Source must be fully annotated; tests need not be.
[[tool.pyrefly.sub-config]]
matches = "src/**"

[tool.pyrefly.sub-config.errors]
implicit-any-parameter = true
