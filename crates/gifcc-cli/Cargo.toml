[package]
name = "gif-color-changer"
description = "Replace colors across every frame of a GIF from the command line."
readme = "../../README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "gifcc"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
gifcc-core = { version = "1.0.0", path = "../gifcc-core", features = ["parallel"] }

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"
