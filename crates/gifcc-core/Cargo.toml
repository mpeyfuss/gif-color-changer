[package]
name = "gifcc-core"
description = "Core color replacement and GIF I/O for gif-color-changer."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
color_quant = "1.1.0"
gif = "0.14.2"
rayon = { version = "1.12.0", optional = true }

[features]
parallel = ["dep:rayon"]

[dev-dependencies]
serde_json = "1.0.151"
